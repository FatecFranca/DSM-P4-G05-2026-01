name: CD

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy backend (Render)
    if: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: curl -sS -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}"

  deploy-front:
    name: Deploy frontend (build + Render)
    if: ${{ secrets.RENDER_FRONT_DEPLOY_HOOK_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
        working-directory: front
      - run: npm run build
        working-directory: front
        env:
          CI: "true"
      - name: Trigger Render static deploy hook
        run: curl -sS -X POST "${{ secrets.RENDER_FRONT_DEPLOY_HOOK_URL }}"

  publish-mobile:
    name: Publish mobile (EAS Update)
    if: ${{ secrets.EXPO_TOKEN != '' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/GymRadar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/GymRadar/package-lock.json
      - run: npm ci
      - name: Push an OTA update via EAS
        run: npx eas-cli update --auto --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
